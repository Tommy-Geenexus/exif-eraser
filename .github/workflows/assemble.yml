name: Assemble
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KS_BASE_64: ${{ secrets.KS_BASE_64 }}
      KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
      KS_KEY_ALIAS: ${{ secrets.KS_KEY_ALIAS }}
      KS_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}
      APK_NAME: 'app-release.apk'
      APK_PATH: 'app/build/outputs/apk/release/app-release.apk'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # https://github.com/gradle/gradle/issues/29595
      - name: Assemble release
        run: |
          ./gradlew --dependency-verification lenient assembleRelease \
            -DKS_BASE_64=${KS_BASE_64} \
            -DKS_PASSWORD=${KS_PASSWORD} \
            -DKS_KEY_ALIAS=${KS_KEY_ALIAS} \
            -DKS_KEY_PASSWORD=${KS_KEY_PASSWORD}

      - name: Upload apk
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          overwrite: true
          retention-days: 1
